server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Real client IP when sitting behind Server 1 / a load balancer
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    client_max_body_size 20M; # allows fingerprint/photo/document uploads

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # pgBadger DB performance reports — reverse-proxied to the pgbadger-web
    # container (not publicly exposed) and gated with HTTP Basic Auth, since the
    # reports embed query text containing PII (national IDs, names). The htpasswd
    # file is generated at boot from PGBADGER_AUTH_* (see docker/entrypoint.sh).
    # `^~` stops the `\.php$` regex below from hijacking any /pgbadger/*.php path.
    location ^~ /pgbadger/ {
        auth_basic "pgBadger Reports";
        auth_basic_user_file /etc/nginx/pgbadger.htpasswd;

        # Resolve the upstream at request time (via Docker's embedded DNS) so
        # nginx still starts if pgbadger-web is briefly unavailable.
        resolver 127.0.0.11 valid=30s;
        set $pgbadger_upstream pgbadger-web;
        rewrite ^/pgbadger/(.*)$ /$1 break;
        proxy_pass http://$pgbadger_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /pgbadger { return 301 /pgbadger/; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
