# Production — builds and runs the full stack on the deployment server.
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - app

  app:
    build:
      context: ./Backend
      target: app
    restart: unless-stopped
    ports:
      - "80:80"
    # Secrets (APP_KEY, DB/Mongo credentials) come from an off-repo env file on
    # the server. See deploy/env.production.example for the required keys and
    # SECURITY.md for provisioning. This file MUST exist before deploy.
    env_file:
      - /opt/civil-registry/.env.production
    environment:
      APP_NAME: CivilRegistry
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://134.209.105.170
      FRONTEND_URL: http://134.209.105.170:3000
      # Restrict CORS to the deployed frontend origin (config default falls back
      # to '*' otherwise — see Backend/config/cors.php).
      CORS_ALLOWED_ORIGINS: http://134.209.105.170:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: civil_registry
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: civil_registry_docs
      # civil_app is defined on the civil_registry_docs db, so auth against it.
      MONGO_AUTH_SOURCE: civil_registry_docs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      # DigitalOcean blocks outbound SMTP ports on droplets, so we don't send
      # real email. The `log` mail driver writes the message (incl. the OTP) to
      # the stderr log channel, which surfaces in `docker compose logs app`.
      MAIL_MAILER: log
      MAIL_LOG_CHANNEL: stderr
      MAIL_FROM_ADDRESS: sina015772825@gmail.com
      MAIL_FROM_NAME: CivilRegistry
      # Migrations are NOT run on container boot anymore — they run as an explicit,
      # backed-up deploy step (deploy/migrate.sh) as the DB superuser.
      PGBADGER_URL: http://134.209.105.170:8081
    depends_on:
      - postgres
      - mongo
      - redis
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs

  postgres:
    build:
      context: ./Backend/docker/postgres
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD (superuser) come from the off-repo env file.
    env_file:
      - /opt/civil-registry/.env.production
    environment:
      POSTGRES_DB: civil_registry
    command: postgres -c config_file=/etc/postgresql/pgbadger.conf
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — reach via SSH tunnel, not the public internet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg-logs:/var/log/postgresql

  # pgBadger — parses the PostgreSQL logs (shared pg-logs volume) into HTML
  # performance reports on a cron schedule (hourly incremental, nightly full).
  pgbadger:
    build:
      context: ./Backend/docker/pgbadger
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - pg-logs:/var/log/postgresql:ro
      - pgbadger-reports:/var/www/pgbadger
      - pgbadger-data:/var/lib/pgbadger

  # Serves the generated pgBadger reports; linked from the admin dashboard.
  pgbadger-web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - pgbadger
    ports:
      # Loopback only — pgBadger reports contain query text with bind params
      # (national IDs, names). Reach via SSH tunnel until it's put behind auth
      # via the reverse proxy (Phase 1.5). Was publicly exposed on "8081:80".
      - "127.0.0.1:8081:80"
    volumes:
      - pgbadger-reports:/usr/share/nginx/html:ro

  mongo:
    image: mongo:7
    restart: unless-stopped
    # --auth enforces authentication. Root + civil_app credentials come from the
    # off-repo env file. The init script (fresh volume only) creates civil_app;
    # existing volumes are provisioned via deploy/provision-mongo-user.js.
    command: ["mongod", "--auth"]
    env_file:
      - /opt/civil-registry/.env.production
    ports:
      - "127.0.0.1:27017:27017"   # loopback only — reach via SSH tunnel, not the public internet
    volumes:
      - mongodata:/data/db
      - ./Backend/docker/mongo/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # loopback only — reach via SSH tunnel, not the public internet
    volumes:
      - redisdata:/data

volumes:
  app-storage:
  app-logs:
  pgdata:
  pg-logs:
  mongodata:
  redisdata:
  pgbadger-reports:
  pgbadger-data:
